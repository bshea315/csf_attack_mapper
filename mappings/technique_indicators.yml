        - "user"

    behavioral_patterns:
      - pattern: "(?i)fodhelper\\.exe"
        weight: 0.92
        description: "Fodhelper UAC bypass"
      - pattern: "(?i)eventvwr\\.exe"
        weight: 0.85
        description: "Event Viewer UAC bypass"
      - pattern: "(?i)sdclt\\.exe"
        weight: 0.88
