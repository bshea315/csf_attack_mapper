# Technique Indicators Database for Enhanced MITRE Mapping
# This file provides deterministic, multi-signal indicators for MITRE techniques
#
# Signal Weights:
#   - data_sources: 0.25 (indexes, sourcetypes, datamodels)
#   - field_indicators: 0.30 (fields referenced in SPL)
#   - behavioral_patterns: 0.35 (regex patterns in SPL)
#   - tag_confirmation: 0.10 (original MITRE tags)

version: "2.0"
description: "Deterministic technique indicators for SPL-based MITRE mapping"

# Confidence thresholds
thresholds:
  high: 0.70      # Auto-accept
  medium: 0.45    # Accept with review flag
  low: 0.25       # Suggest for review
  none: 0.0       # Don't map

# Tactic criticality weights (for recommendation scoring)
tactic_criticality:
  initial-access: 1.0
  execution: 0.95
  persistence: 0.90
  privilege-escalation: 0.90
  defense-evasion: 0.85
  credential-access: 0.85
  lateral-movement: 0.80
  exfiltration: 0.80
  command-and-control: 0.75
  impact: 0.75
  collection: 0.70
  reconnaissance: 0.60
  discovery: 0.50
  resource-development: 0.40

indicators:
  # ============================================
  # EXECUTION
  # ============================================
  T1059.001:
    name: "PowerShell"
    tactic: "execution"
    description: "Adversaries may abuse PowerShell commands and scripts for execution"

    data_sources:
      strong:
        indexes: ["wineventlog", "windows", "main"]
        sourcetypes:
          - "WinEventLog:Microsoft-Windows-PowerShell/Operational"
          - "XmlWinEventLog:Microsoft-Windows-PowerShell/Operational"
          - "powershell"
          - "powershell:scriptblock"
        datamodels: ["Endpoint"]
      moderate:
        sourcetypes:
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
          - "sysmon"
          - "WinEventLog:Security"

    field_indicators:
      strong:
        - "ScriptBlockText"
        - "CommandLine"
        - "command_line"
        - "process_name"
        - "HostApplication"
      moderate:
        - "ParentCommandLine"
        - "parent_process"
        - "User"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)powershell.*-enc[odedcommand]*\\s"
        weight: 0.95
        description: "Encoded PowerShell command"
      - pattern: "(?i)powershell.*-nop.*-w\\s*hidden"
        weight: 0.92
        description: "Hidden window, no profile"
      - pattern: "(?i)powershell.*downloadstring"
        weight: 0.88
        description: "Remote download via DownloadString"
      - pattern: "(?i)invoke-webrequest|iwr\\s"
        weight: 0.85
        description: "Web request invocation"
      - pattern: "(?i)invoke-expression|iex\\s*\\("
        weight: 0.80
        description: "Dynamic code execution"
      - pattern: "(?i)-exec.*bypass"
        weight: 0.78
        description: "Execution policy bypass"
      - pattern: "(?i)New-Object.*Net\\.WebClient"
        weight: 0.82
        description: "WebClient object creation"
      - pattern: "(?i)powershell\\.exe"
        weight: 0.45
        description: "Basic PowerShell execution"
      - pattern: "(?i)pwsh\\.exe"
        weight: 0.45
        description: "PowerShell Core execution"

    event_ids:
      strong: [4103, 4104]  # Module/Script block logging
      moderate: [4688]       # Process creation

  T1059.003:
    name: "Windows Command Shell"
    tactic: "execution"
    description: "Adversaries may abuse the Windows command shell (cmd.exe) for execution"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:Security"
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        datamodels: ["Endpoint"]
      moderate:
        sourcetypes:
          - "sysmon"

    field_indicators:
      strong:
        - "CommandLine"
        - "command_line"
        - "process_name"
        - "Image"
      moderate:
        - "ParentImage"
        - "parent_process"

    behavioral_patterns:
      - pattern: "(?i)cmd\\.exe.*/c\\s"
        weight: 0.70
        description: "CMD with /c flag"
      - pattern: "(?i)cmd\\.exe.*/k\\s"
        weight: 0.65
        description: "CMD with /k flag"
      - pattern: "(?i)cmd\\.exe.*&&"
        weight: 0.60
        description: "Chained commands"
      - pattern: "(?i)cmd\\.exe"
        weight: 0.40
        description: "Basic CMD execution"

    event_ids:
      strong: [4688, 1]

  T1047:
    name: "Windows Management Instrumentation"
    tactic: "execution"
    description: "Adversaries may abuse WMI to execute malicious commands and payloads"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:Microsoft-Windows-WMI-Activity/Operational"
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        datamodels: ["Endpoint"]
      moderate:
        sourcetypes:
          - "WinEventLog:Security"

    field_indicators:
      strong:
        - "CommandLine"
        - "process_name"
        - "WmiPrvSE"
      moderate:
        - "dest"
        - "user"

    behavioral_patterns:
      - pattern: "(?i)wmic\\s+process\\s+call\\s+create"
        weight: 0.92
        description: "WMI process creation"
      - pattern: "(?i)wmic.*/node:"
        weight: 0.88
        description: "Remote WMI execution"
      - pattern: "(?i)Win32_Process.*Create"
        weight: 0.85
        description: "Win32_Process Create method"
      - pattern: "(?i)wmiprvse\\.exe"
        weight: 0.65
        description: "WMI provider host"
      - pattern: "(?i)wmic"
        weight: 0.50
        description: "Basic WMIC usage"

    event_ids:
      strong: [5857, 5858, 5859, 5860, 5861]
      moderate: [4688]

  T1053.005:
    name: "Scheduled Task"
    tactic: "persistence"
    description: "Adversaries may abuse the Windows Task Scheduler to execute malicious code"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:Security"
          - "WinEventLog:Microsoft-Windows-TaskScheduler/Operational"
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        datamodels: ["Endpoint"]

    field_indicators:
      strong:
        - "TaskName"
        - "Command"
        - "CommandLine"
      moderate:
        - "User"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)schtasks.*/create"
        weight: 0.90
        description: "Scheduled task creation"
      - pattern: "(?i)schtasks.*/run"
        weight: 0.75
        description: "Scheduled task execution"
      - pattern: "(?i)schtasks.*/change"
        weight: 0.80
        description: "Scheduled task modification"
      - pattern: "(?i)Register-ScheduledTask"
        weight: 0.85
        description: "PowerShell task registration"
      - pattern: "(?i)TaskScheduler"
        weight: 0.55
        description: "Task Scheduler reference"

    event_ids:
      strong: [4698, 4699, 4700, 4701, 4702]
      moderate: [106, 200, 201]

  # ============================================
  # CREDENTIAL ACCESS
  # ============================================
  T1003.001:
    name: "LSASS Memory"
    tactic: "credential-access"
    description: "Adversaries may attempt to access credential material stored in LSASS"

    data_sources:
      strong:
        sourcetypes:
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
          - "sysmon"
        datamodels: ["Endpoint"]
      moderate:
        sourcetypes:
          - "WinEventLog:Security"

    field_indicators:
      strong:
        - "TargetImage"
        - "SourceImage"
        - "CallTrace"
        - "GrantedAccess"
      moderate:
        - "process_name"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)lsass\\.exe"
        weight: 0.85
        description: "LSASS process reference"
      - pattern: "(?i)mimikatz"
        weight: 0.98
        description: "Mimikatz tool reference"
      - pattern: "(?i)sekurlsa"
        weight: 0.95
        description: "Sekurlsa module reference"
      - pattern: "(?i)procdump.*lsass"
        weight: 0.92
        description: "Process dump of LSASS"
      - pattern: "(?i)comsvcs\\.dll.*MiniDump"
        weight: 0.90
        description: "MiniDump via comsvcs"
      - pattern: "(?i)GrantedAccess.*(0x1010|0x1FFFFF)"
        weight: 0.88
        description: "Suspicious LSASS access rights"
      - pattern: "(?i)credential.*dump"
        weight: 0.70
        description: "Credential dump reference"

    event_ids:
      strong: [10]  # Sysmon ProcessAccess
      moderate: [4688, 4663]

  T1003.002:
    name: "Security Account Manager"
    tactic: "credential-access"
    description: "Adversaries may attempt to extract credential material from the SAM database"

    data_sources:
      strong:
        sourcetypes:
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
          - "WinEventLog:Security"
        datamodels: ["Endpoint"]

    field_indicators:
      strong:
        - "TargetFilename"
        - "CommandLine"
        - "ObjectName"
      moderate:
        - "process_name"

    behavioral_patterns:
      - pattern: "(?i)reg\\s+save\\s+HKLM\\\\SAM"
        weight: 0.95
        description: "SAM registry export"
      - pattern: "(?i)reg\\s+save\\s+HKLM\\\\SYSTEM"
        weight: 0.90
        description: "SYSTEM registry export"
      - pattern: "(?i)ntdsutil"
        weight: 0.88
        description: "NTDS utility usage"
      - pattern: "(?i)secretsdump"
        weight: 0.95
        description: "SecretsDump tool"
      - pattern: "(?i)shadow.*copy"
        weight: 0.75
        description: "Shadow copy access"
      - pattern: "(?i)vssadmin.*create.*shadow"
        weight: 0.80
        description: "VSS shadow creation"

    event_ids:
      strong: [4663]
      moderate: [4688]

  T1110:
    name: "Brute Force"
    tactic: "credential-access"
    description: "Adversaries may use brute force techniques to gain access to accounts"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:Security"
          - "XmlWinEventLog:Security"
          - "azure:aad:signin"
          - "o365:management:activity"
        datamodels: ["Authentication"]
      moderate:
        sourcetypes:
          - "linux_secure"
          - "syslog"

    field_indicators:
      strong:
        - "FailureReason"
        - "LogonType"
        - "Status"
        - "SubStatus"
        - "failure_count"
      moderate:
        - "user"
        - "src"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)EventCode\\s*=\\s*4625"
        weight: 0.85
        description: "Windows failed logon events"
      - pattern: "(?i)password.*spray"
        weight: 0.90
        description: "Password spray reference"
      - pattern: "(?i)brute.*force"
        weight: 0.88
        description: "Brute force reference"
      - pattern: "(?i)multiple.*failed.*logon"
        weight: 0.80
        description: "Multiple failed logon reference"
      - pattern: "(?i)account.*lockout"
        weight: 0.75
        description: "Account lockout reference"
      - pattern: "(?i)stats.*count.*by.*user"
        weight: 0.60
        description: "User-based counting pattern"

    event_ids:
      strong: [4625, 4771, 4776]
      moderate: [4624]

  T1558.003:
    name: "Kerberoasting"
    tactic: "credential-access"
    description: "Adversaries may abuse Kerberos to steal service account credentials"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:Security"
          - "XmlWinEventLog:Security"

    field_indicators:
      strong:
        - "ServiceName"
        - "TicketEncryptionType"
        - "TicketOptions"
      moderate:
        - "user"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)kerberoast"
        weight: 0.95
        description: "Kerberoasting reference"
      - pattern: "(?i)EventCode\\s*=\\s*4769"
        weight: 0.80
        description: "TGS request event"
      - pattern: "(?i)TicketEncryptionType.*(0x17|23)"
        weight: 0.90
        description: "RC4 encryption type"
      - pattern: "(?i)Invoke-Kerberoast"
        weight: 0.98
        description: "Kerberoast PowerShell"
      - pattern: "(?i)GetUserSPNs"
        weight: 0.92
        description: "SPN enumeration"

    event_ids:
      strong: [4769]

  # ============================================
  # PERSISTENCE
  # ============================================
  T1547.001:
    name: "Registry Run Keys / Startup Folder"
    tactic: "persistence"
    description: "Adversaries may achieve persistence using registry run keys or startup folder"

    data_sources:
      strong:
        sourcetypes:
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
          - "sysmon"
          - "WinEventLog:Security"
        datamodels: ["Endpoint", "Change"]

    field_indicators:
      strong:
        - "TargetObject"
        - "registry_path"
        - "registry_value_name"
        - "Details"
      moderate:
        - "process_name"
        - "user"

    behavioral_patterns:
      - pattern: "(?i)\\\\CurrentVersion\\\\Run\\b"
        weight: 0.90
        description: "Run key path"
      - pattern: "(?i)\\\\CurrentVersion\\\\RunOnce"
        weight: 0.88
        description: "RunOnce key path"
      - pattern: "(?i)\\\\Startup\\\\"
        weight: 0.85
        description: "Startup folder path"
      - pattern: "(?i)HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
        weight: 0.92
        description: "Full Run key path"
      - pattern: "(?i)registry.*persistence"
        weight: 0.70
        description: "Registry persistence reference"

    event_ids:
      strong: [13]  # Sysmon RegistryEvent
      moderate: [4657]

  T1543.003:
    name: "Windows Service"
    tactic: "persistence"
    description: "Adversaries may create or modify Windows services to maintain persistence"

    data_sources:
      strong:
        sourcetypes:
          - "WinEventLog:System"
          - "WinEventLog:Security"
          - "XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
        datamodels: ["Endpoint", "Change"]

    field_indicators:
      strong:
        - "ServiceName"
        - "ImagePath"
        - "ServiceType"
        - "StartType"
      moderate:
        - "user"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)sc\\s+create"
        weight: 0.90
        description: "Service creation command"
      - pattern: "(?i)New-Service"
        weight: 0.88
        description: "PowerShell service creation"
      - pattern: "(?i)EventCode\\s*=\\s*(7045|4697)"
        weight: 0.85
        description: "Service installation event"
      - pattern: "(?i)services\\.exe"
        weight: 0.50
        description: "Services process"

    event_ids:
      strong: [7045, 4697]
      moderate: [7034, 7036]

  # ============================================
  # PRIVILEGE ESCALATION
  # ============================================
  T1548.002:
    name: "Bypass User Account Control"
    tactic: "privilege-escalation"
    description: "Adversaries may bypass UAC mechanisms to elevate privileges"

    data_sources:
