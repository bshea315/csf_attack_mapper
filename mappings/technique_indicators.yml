      moderate:
        - "user"
        - "dest"

    behavioral_patterns:
      - pattern: "(?i)wevtutil\\s+cl"
        weight: 0.95
        description: "Event log clear command"
      - pattern: "(?i)Clear-EventLog"
        weight: 0.92
        description: "PowerShell event log clear"
      - pattern: "(?i)EventCode\\s*=\\s*(1102|104)"
        weight: 0.90
        description: "Log cleared event"
      - pattern: "(?i)event.*log.*clear"
        weight: 0.80
